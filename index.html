<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>다루마!! 일본어 말하기 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  /* 이미 로그인되어 있으면 화면이 잠깐이라도 보이기 전에 바로 문제 화면으로 이동 */
  try{
    if(localStorage.getItem("jpk_student_v1")){ location.replace("problem.html"); }
  }catch(e){}
</script>
</head>
<body>
<div class="wrap">

  <section id="screen-login">
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <div class="hero-title">다루마!!
            <span class="underline">
              <svg viewBox="0 0 200 20" preserveAspectRatio="none">
                <path d="M2,7 Q100,-2 198,7" fill="none" stroke="#b8392d" stroke-width="5" stroke-linecap="round"/>
                <path d="M2,15 Q100,7 198,15" fill="none" stroke="#b8392d" stroke-width="5" stroke-linecap="round"/>
              </svg>
            </span>
          </div>
          <div class="hero-sub">말하는 것을<br>다 이루어주마</div>
        </div>

        <img class="hero-genie" src="다루마.png" alt="다루마">
      </div>
    </div>

    <div class="card">
      <h1>말하기 연습을 시작해요 🎌</h1>
      <p class="desc">학번과 이름을 입력하면 연습 기록이 자동으로 저장돼요. 매번 같은 정보로 입력해 주세요.</p>

      <label for="inpId">학번</label>
      <input type="text" id="inpId" placeholder="예: 20413" inputmode="numeric">

      <label for="inpName">이름</label>
      <input type="text" id="inpName" placeholder="예: 홍길동">

      <div class="consent">
        <input type="checkbox" id="chkConsent">
        <label for="chkConsent" style="margin:0;font-weight:500;">
          입력한 학번·이름과 말하기 연습 기록(발음 점수 등)이 선생님 확인 및 학습 관리 목적으로 저장·전송되는 것에 동의합니다. 음성 파일 자체는 저장되지 않으며, 텍스트로 변환 후 즉시 폐기됩니다.
        </label>
      </div>

      <button class="btn btn-primary" id="btnLogin">시작하기</button>
    </div>
    <p class="footer-note">Google Chrome 브라우저(PC 또는 안드로이드)에서 가장 안정적으로 작동해요.</p>
  </section>

</div>

<script>
(function(){
"use strict";

const LS_STUDENT = "jpk_student_v1";
const $ = (sel) => document.querySelector(sel);

function saveStudent(s){
  localStorage.setItem(LS_STUDENT, JSON.stringify(s));
}

$("#btnLogin").addEventListener("click", () => {
  const id = $("#inpId").value.trim();
  const name = $("#inpName").value.trim();
  const agree = $("#chkConsent").checked;
  if(!id || !name){ alert("학번과 이름을 모두 입력해 주세요."); return; }
  if(!agree){ alert("개인정보 저장에 동의해야 시작할 수 있어요."); return; }
  saveStudent({ id, name });
  location.href = "problem.html";
});

})();
</script>
</body>
</html>
