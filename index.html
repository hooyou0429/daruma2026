<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>다루마!! 일본어 말하기 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#dc4c3f;
    --primary-dark:#b8392d;
    --primary-light:#fdeceb;
    --ink:#2b2420;
    --sub:#6b625c;
    --bg:#faf6f2;
    --card:#ffffff;
    --line:#ece4dd;
    --good:#2f9e5c;
    --good-bg:#eafaf1;
    --bad:#d8483e;
    --bad-bg:#fdeceb;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    line-height:1.5;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px 18px;
  }
  header.top .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;font-family:"Jua",sans-serif;}
  header.top .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);}
  header.top .who{font-size:13px;color:var(--sub);}

  /* ===== 첫 화면 상단 히어로(다루마 타이틀 + 지니) ===== */
  .hero{position:relative;padding:26px 8px 6px;overflow:hidden;}
  .hero-inner{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .hero-text{flex:1;min-width:0;}
  .hero-title{
    font-family:"Jua",sans-serif;font-size:44px;color:var(--ink);line-height:1;
    display:inline-block;position:relative;margin:0 0 14px;
  }
  .hero-title .underline{position:absolute;left:2px;right:2px;bottom:-10px;height:14px;}
  .hero-title .underline svg{width:100%;height:100%;display:block;}
  .hero-sub{
    font-family:"Gaegu",sans-serif;font-weight:700;font-size:24px;color:var(--ink);
    line-height:1.45;margin-top:22px;
  }
  .hero-genie{width:150px;height:150px;flex-shrink:0;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(184,57,45,.18));}
  @media (max-width:420px){
    .hero-title{font-size:34px;}
    .hero-sub{font-size:18px;}
    .hero-genie{width:112px;height:112px;}
  }
  nav.tabs{
    display:flex;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:4px;margin-bottom:18px;
  }
  nav.tabs button{
    flex:1;border:none;background:transparent;padding:10px 8px;border-radius:999px;
    font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s;
  }
  nav.tabs button.active{background:var(--primary);color:#fff;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(30,20,10,.03);
  }
  h1{font-size:22px;margin:0 0 6px;}
  h2{font-size:17px;margin:0 0 12px;}
  p.desc{color:var(--sub);font-size:14px;margin:0 0 18px;}
  label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text], select, textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;background:#fff;color:var(--ink);font-family:inherit;
  }
  input[type=text]:focus, select:focus, textarea:focus{outline:none;border-color:var(--primary);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 18px;border-radius:12px;border:none;font-size:15px;font-weight:800;
    cursor:pointer;transition:.15s;width:100%;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{background:#e3bab3;cursor:not-allowed;}
  .btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-ghost{background:#f4efe9;color:var(--ink);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{width:auto;flex:1;}
  .consent{
    display:flex;gap:10px;align-items:flex-start;background:#f7f2ec;border-radius:10px;
    padding:12px 14px;font-size:12.5px;color:var(--sub);margin:16px 0;
  }
  .consent input{margin-top:2px;}
  .chip{
    display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;
    background:var(--primary-light);color:var(--primary-dark);
  }
  .sentence-box{
    background:#fff8f4;border:1.5px dashed #e9c6bd;border-radius:14px;
    padding:22px 18px;text-align:center;margin:16px 0;
  }
  .progress-line{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--sub);font-weight:600;}
  .progress-bar{flex:1;height:7px;background:#f0e8e2;border-radius:999px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .25s;}
  .complete-card{text-align:center;}
  .complete-emoji{font-size:46px;line-height:1;margin-bottom:8px;}
  .complete-card h2{margin-bottom:8px;}
  .complete-desc{color:var(--sub);font-size:14px;margin:0 0 20px;}
  .sentence-jp{font-size:26px;font-weight:800;letter-spacing:.5px;line-height:1.6;}
  .sentence-jp ruby rt{font-size:12px;color:var(--sub);font-weight:600;}
  .sentence-ko{font-size:14px;color:var(--sub);margin-top:8px;}
  .mic-area{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 10px;}
  .mic-btn{
    width:88px;height:88px;border-radius:50%;border:none;background:var(--primary);
    color:#fff;font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(220,76,63,.35);transition:.15s;
  }
  .mic-btn:active{transform:scale(.94);}
  .mic-btn.listening{
    background:var(--bad);animation:pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(216,72,62,.5);}
    70%{box-shadow:0 0 0 18px rgba(216,72,62,0);}
    100%{box-shadow:0 0 0 0 rgba(216,72,62,0);}
  }
  .mic-status{font-size:13px;color:var(--sub);font-weight:600;min-height:18px;}
  .result-card{border-radius:14px;padding:18px;margin-top:16px;}
  .result-card.pass{background:var(--good-bg);border:1.5px solid #b7e6c7;}
  .result-card.retry{background:var(--bad-bg);border:1.5px solid #f2c2bd;}
  .result-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .result-badge{font-weight:800;font-size:15px;}
  .result-badge.pass{color:var(--good);}
  .result-badge.retry{color:var(--bad);}
  .score-num{font-size:26px;font-weight:900;}
  .diff-line{font-size:19px;font-weight:700;line-height:1.7;word-break:keep-all;margin:6px 0;}
  .diff-line .m{color:var(--good);}
  .diff-line .x{color:var(--bad);text-decoration:line-through;opacity:.7;}
  .heard-label{font-size:12px;color:var(--sub);font-weight:700;margin-top:10px;}
  .small-note{font-size:12px;color:var(--sub);margin-top:10px;}
  .sync-note{font-size:11.5px;margin-top:8px;display:flex;align-items:center;gap:6px;color:var(--sub);}
  .dot-sync{width:7px;height:7px;border-radius:50%;background:#c9c1ba;}
  .dot-sync.ok{background:var(--good);}
  .dot-sync.pending{background:#e0a12a;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);}
  th{color:var(--sub);font-weight:700;font-size:12px;}
  td.score-cell{font-weight:800;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .stat-box{background:#f7f2ec;border-radius:12px;padding:14px 8px;text-align:center;}
  .stat-box .v{font-size:20px;font-weight:900;color:var(--primary-dark);}
  .stat-box .l{font-size:11px;color:var(--sub);margin-top:2px;}
  canvas{width:100%;height:140px;display:block;margin:6px 0 4px;}
  .empty{text-align:center;color:var(--sub);font-size:13.5px;padding:30px 10px;}
  .footer-note{text-align:center;font-size:11.5px;color:#a89e95;margin-top:22px;}
  .warn-box{background:#fff6e0;border:1px solid #f0d78c;border-radius:10px;padding:12px 14px;font-size:13px;color:#7a5e12;margin-bottom:16px;}
  .switch-link{background:none;border:none;color:var(--primary);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;}
  select.cat-select{margin-bottom:10px;}
  .top-actions{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .link-btn{background:none;border:none;color:var(--sub);font-size:12.5px;cursor:pointer;text-decoration:underline;}
  @media (max-width:380px){
    .sentence-jp{font-size:22px;}
    .stat-box .v{font-size:17px;}
  }
</style>
</head>

/* ---- 유틸: ruby 태그 제거하고 순수 텍스트만 추출 ---- */
function stripRuby(html){
  const div = document.createElement("div");
  div.innerHTML = html;
  div.querySelectorAll("rt").forEach(rt => rt.remove());
  return div.textContent.trim();
}

/* ---- 한자→히라가나 보정 사전 만들기: questions.js의 모든 <ruby>한자<rt>읽기</rt></ruby>를
   자동 수집 + READING_OVERRIDES 병합. 채점 시 한자 표기와 히라가나 표기를 같은 것으로 취급하기 위함 ---- */
function buildReadingMap(){
  const map = Object.assign({}, ACTIVE_READING_OVERRIDES);
  const rubyRe = /<ruby>([^<]+)<rt>([^<]+)<\/rt><\/ruby>/g;
  ACTIVE_SENTENCES.forEach(item => {
    let m;
    rubyRe.lastIndex = 0;
    while((m = rubyRe.exec(item.jp))){
      const kanji = m[1], reading = m[2];
      if(!map[kanji]) map[kanji] = reading;
    }
  });
  return map;
}
let READING_MAP = buildReadingMap();
let READING_MAP_KEYS = Object.keys(READING_MAP).sort((a,b) => b.length - a.length);
function refreshReadingMap(){
  READING_MAP = buildReadingMap();
  READING_MAP_KEYS = Object.keys(READING_MAP).sort((a,b) => b.length - a.length);
}

/* ---- 한자를 위 사전을 이용해 히라가나로 치환 (긴 단어부터 우선 치환) ---- */
function toReadingForm(text){
  if(!text) return text;
  let result = text;
  for(const k of READING_MAP_KEYS){
    if(result.indexOf(k) !== -1){
      result = result.split(k).join(READING_MAP[k]);
    }
  }
  return result;
}

/* ---- 정규화: 채점 전에 한자→히라가나 치환, 공백/구두점 제거, NFKC 정규화 ---- */
function normalize(str){
  if(!str) return "";
  let s = str.normalize("NFKC");
  s = toReadingForm(s);
  s = s.replace(/[\s　。、！？!?,\.「」『』・～~"'"'（）()]/g, "");
  return s;
}

/* ---- 레벤슈타인 거리 ---- */
function levenshtein(a, b){
  const al = a.length, bl = b.length;
  if(al === 0) return bl;
  if(bl === 0) return al;
  const dp = new Array(bl + 1);
  for(let j = 0; j <= bl; j++) dp[j] = j;
  for(let i = 1; i <= al; i++){
    let prev = dp[0];
    dp[0] = i;
    for(let j = 1; j <= bl; j++){
      const tmp = dp[j];
      dp[j] = Math.min(
        dp[j] + 1,
        dp[j-1] + 1,
        prev + (a[i-1] === b[j-1] ? 0 : 1)
      );
      prev = tmp;
    }
  }
  return dp[bl];
}

/* ---- 점수 계산 (0~100) ---- */
function scoreOf(target, heard){
  const t = normalize(target);
  const h = normalize(heard);
  if(t.length === 0) return 0;
  const dist = levenshtein(t, h);
  const maxLen = Math.max(t.length, h.length);
  const sim = Math.max(0, 1 - dist / maxLen);
  return Math.round(sim * 100);
}

/* ---- 최장 공통 부분수열 기반 diff 표시(정답 문장 기준으로 맞은 글자 강조) ---- */
function diffHighlight(target, heard){
  const t = normalize(target);
  const h = normalize(heard);
  const tl = t.length, hl = h.length;
  const dp = Array.from({length:tl+1}, () => new Array(hl+1).fill(0));
  for(let i=1;i<=tl;i++){
    for(let j=1;j<=hl;j++){
      dp[i][j] = t[i-1]===h[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  let i=tl, j=hl;
  const matched = new Array(tl).fill(false);
  while(i>0 && j>0){
    if(t[i-1]===h[j-1]){ matched[i-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  let out = "";
  for(let k=0;k<tl;k++){
    out += matched[k] ? `<span class="m">${t[k]}</span>` : `<span class="x">${t[k]}</span>`;
  }
  return out;
}

function getCategoryList(){

}
function getSentencesForCategory(cat){
  return ACTIVE_SENTENCES.filter(s => s.category === cat);
}
function sentenceId(item){
  return item.category + "||" + item.jp;
}

/* ---- 통과 기록(카테고리별 진행 상황) 저장소 ---- */
function passedKey(){ return LS_PASSED_PREFIX + studentKey(student); }
function getPassedSet(){
  try{
    const raw = localStorage.getItem(passedKey());
    return new Set(raw ? JSON.parse(raw) : []);
  }catch(e){ return new Set(); }
}
function savePassedSet(set){
  localStorage.setItem(passedKey(), JSON.stringify([...set]));
}
function markPassed(id){
  const set = getPassedSet();
  set.add(id);
  savePassedSet(set);
}
function findFirstUnpassed(cat){
  const list = getSentencesForCategory(cat);
  const passed = getPassedSet();
  const candidate = list.find(item => !passed.has(sentenceId(item)) && !skippedIds.has(sentenceId(item)));
  if(candidate) return candidate;
  // 이번 세션에서 건너뛴 문장만 남았다면, 다시 처음부터 도전할 수 있도록 순환시킨다.
  return list.find(item => !passed.has(sentenceId(item))) || null;
}
function countPassedInCategory(cat){
  const list = getSentencesForCategory(cat);
  const passed = getPassedSet();
  return list.filter(item => passed.has(sentenceId(item))).length;
}

function populateCategories(){
  const cats = getCategoryList();
  const sel = $("#selCategory");
  sel.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join("");

  $("#progressText").textContent = `${passed} / ${total} 문장 통과`;
  $("#progressBarFill").style.width = (total ? Math.round(passed/total*100) : 0) + "%";

/* =========================================================================
   음성 인식 (Web Speech API)
   ========================================================================= */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC_UNSUPPORTED_MSG = "⚠️ 이 브라우저는 음성 인식을 지원하지 않아요. Google Chrome(PC 또는 안드로이드)에서 접속해 주세요. (iPhone Safari는 지원되지 않습니다)";

function initSpeechWarning(){
  if(!SpeechRecognitionAPI){
    $("#micWarnCard").style.display = "";
    $("#micWarnText").textContent = MIC_UNSUPPORTED_MSG;
    $("#btnMic").disabled = true;
    $("#btnMic").style.opacity = "0.4";
    alert(MIC_UNSUPPORTED_MSG);
  }
}

$("#btnMic").addEventListener("click", () => {
  if(!SpeechRecognitionAPI){ return; }
  if(!currentSentence){ alert("먼저 연습할 문장을 선택해 주세요."); return; }
  if(listening){ stopListening(); return; }
  startListening();
});

function startListening(){
  recognition = new SpeechRecognitionAPI();
  recognition.lang = "ja-JP";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  listening = true;
  $("#btnMic").classList.add("listening");
  $("#micStatus").textContent = "듣고 있어요... 문장을 말해보세요";
  $("#resultArea").innerHTML = "";

  recognition.onresult = (e) => {
    const heard = e.results[0][0].transcript;
    handleResult(heard);
  };
  recognition.onerror = (e) => {
    stopListening();
    let msg = "음성 인식 중 오류가 발생했어요. 다시 시도해 주세요.";
    let popup = null;
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      msg = "마이크 사용 권한을 허용해 주세요.";
      popup = "마이크 사용 권한이 차단되어 있어요. 브라우저 주소창 옆 아이콘에서 마이크 권한을 허용한 뒤 다시 시도해 주세요.";
    } else if(e.error === "no-speech"){
      msg = "음성이 감지되지 않았어요. 다시 눌러서 말해보세요.";
    } else if(e.error === "audio-capture"){
      msg = "마이크를 찾을 수 없어요.";
      popup = "마이크를 찾을 수 없어요. 마이크가 연결되어 있는지, 다른 프로그램에서 사용 중이지 않은지 확인해 주세요.";
    } else if(e.error === "language-not-supported"){
      msg = "이 브라우저는 일본어 음성 인식을 지원하지 않아요.";
      popup = "이 브라우저는 일본어 음성 인식을 지원하지 않아요. Google Chrome(PC 또는 안드로이드)에서 다시 시도해 주세요.";
    } else if(e.error === "network"){
      msg = "네트워크 오류로 음성 인식에 실패했어요.";
      popup = "네트워크 오류로 음성 인식에 실패했어요. 인터넷 연결을 확인하거나 다른 브라우저(Chrome 권장)에서 다시 시도해 주세요.";
    } else if(e.error !== "aborted"){
      popup = "음성 인식 중 오류가 발생했어요. 계속되면 다른 브라우저(Chrome 권장)에서 다시 시도해 주세요.";
    }
    $("#micStatus").textContent = msg;
    if(popup) alert(popup);
  };
  recognition.onend = () => { stopListening(); };

  try{ recognition.start(); }catch(err){ stopListening(); alert(MIC_UNSUPPORTED_MSG); }
}
function stopListening(){
  listening = false;
  $("#btnMic").classList.remove("listening");
  if(recognition){ try{ recognition.stop(); }catch(e){} }
}

/* =========================================================================
   채점 결과 처리 및 기록 저장/전송
   ========================================================================= */
function handleResult(heardText){
  const target = currentSentence.plain;
  const score = scoreOf(target, heardText);
  const pass = score >= CONFIG.PASS_THRESHOLD;
  const diffHtml = diffHighlight(target, heardText);

  $("#micStatus").textContent = "마이크를 눌러 다시 연습해보세요";

  const record = {
    ts: new Date().toISOString(),
    studentId: student.id,
    studentName: student.name,
    sentence: target,
    recognized: heardText,
    score: score,
    pass: pass
  };
  saveLocalRecord(record);
  sendToSheet(record);

  const isTracked = !!currentSentence.id;
  if(pass && isTracked){
    markPassed(currentSentence.id);
    renderProgress($("#selCategory").value);
    wrongStreak = 0;
  }

  let autoAdvance = false;
  if(!pass){
    wrongStreak++;
    if(isTracked && wrongStreak >= WRONG_STREAK_LIMIT){
      skippedIds.add(currentSentence.id);
      wrongStreak = 0;
      autoAdvance = true;
    }
  }

  renderResult(pass, score, diffHtml, heardText, isTracked, autoAdvance);

  if(autoAdvance){
    setTimeout(loadCategory, 1600);
  }
}

function renderResult(pass, score, diffHtml, heardText, isTracked, autoAdvance){
  const cls = pass ? "pass" : "retry";
  const label = pass ? "✅ 통과!" : (autoAdvance ? "❌ 오답 (3회 연속)" : "🔁 다시 도전!");
  const advanceBtn = (pass && isTracked)
    ? `<button class="btn btn-primary" id="btnAdvance" style="margin-top:14px;">다음 문장 보기 →</button>`
    : "";
  const autoAdvanceNote = autoAdvance
    ? `<div class="small-note" style="color:var(--bad);font-weight:700;">3번 연속 오답이라 오답으로 기록하고 잠시 후 다음 문장으로 넘어갈게요...</div>`
    : "";
  $("#resultArea").innerHTML = `
    <div class="result-card ${cls}">
      <div class="result-top">
        <div class="result-badge ${cls}">${label}</div>
        <div class="score-num">${score}<span style="font-size:14px;">%</span></div>
      </div>
      <div class="diff-line">${diffHtml}</div>
      <div class="heard-label">내가 말한 것으로 인식된 내용</div>
      <div style="font-size:14px;color:var(--sub);">${heardText || "(인식된 내용 없음)"}</div>
      <div class="small-note">초록색: 정답과 일치 · 빨간색: 정답과 다름 (기준: ${CONFIG.PASS_THRESHOLD}% 이상 통과)</div>
      <div class="sync-note"><span class="dot-sync ${CONFIG.APPS_SCRIPT_URL ? "pending" : ""}" id="syncDot"></span><span id="syncText">${CONFIG.APPS_SCRIPT_URL ? "구글시트로 전송 중..." : "이 기기에만 저장됨 (구글시트 연동 미설정)"}</span></div>
      ${autoAdvanceNote}
      ${advanceBtn}
    </div>
  `;
  if(pass && isTracked){
    $("#btnAdvance").addEventListener("click", loadCategory);
  }
}

/* ---- 로컬 기록 저장 ---- */
function historyKey(){ return LS_HISTORY_PREFIX + studentKey(student); }
function getLocalHistory(){
  try{
    const raw = localStorage.getItem(historyKey());
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveLocalRecord(record){
  const hist = getLocalHistory();
  hist.push(record);
  localStorage.setItem(historyKey(), JSON.stringify(hist));
}

/* ---- 구글시트 전송 (Google Apps Script 웹앱, no-cors 방식) ---- */
function sendToSheet(record){
  if(!CONFIG.APPS_SCRIPT_URL){ return; }
  postRecord(record).then(() => {
    markSyncDot(true);
  }).catch(() => {
    queuePending(record);
    markSyncDot(false);
  });
  flushPending();
}
function markSyncDot(ok){
  const dot = document.getElementById("syncDot");
  const text = document.getElementById("syncText");
  if(!dot) return;
  dot.classList.remove("pending");
  dot.classList.add(ok ? "ok" : "");
  if(text) text.textContent = ok ? "구글시트에 저장 완료" : "전송 실패 - 다음 접속 시 자동 재전송";
}
function postRecord(record){
  return fetch(CONFIG.APPS_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(record)
  });
  // no-cors 모드에서는 응답 내용을 읽을 수 없어 성공 여부를 확실히 알 수 없지만,
  // 네트워크 오류가 없다면 정상적으로 스프레드시트에 기록됩니다.
}
function queuePending(record){
  let pending = [];
  try{ pending = JSON.parse(localStorage.getItem(LS_PENDING) || "[]"); }catch(e){}
  pending.push(record);
  localStorage.setItem(LS_PENDING, JSON.stringify(pending));
}
function flushPending(){
  if(!CONFIG.APPS_SCRIPT_URL) return;
  let pending = [];
  try{ pending = JSON.parse(localStorage.getItem(LS_PENDING) || "[]"); }catch(e){}
  if(pending.length === 0) return;
  localStorage.setItem(LS_PENDING, "[]");
  pending.forEach(r => { postRecord(r).catch(() => queuePending(r)); });
}

/* =========================================================================
   구글시트(문제은행 탭)에서 연습 문장 목록 실시간 불러오기
   실패하거나 구글시트 연동이 설정되어 있지 않으면 questions.js의 기본 목록을 그대로 사용한다.
   ========================================================================= */
function loadSentencesFromSheet(){
  if(!CONFIG.APPS_SCRIPT_URL) return Promise.resolve(false);
  const controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), 6000) : null;
  return fetch(CONFIG.APPS_SCRIPT_URL + "?action=sentences", {
    method: "GET",
    signal: controller ? controller.signal : undefined
  }).then(res => {
    if(timer) clearTimeout(timer);
    if(!res.ok) return false;
    return res.json();
  }).then(data => {
    if(!Array.isArray(data) || data.length === 0) return false;
    const valid = data.every(item => item && typeof item.category === "string" && typeof item.jp === "string");
    if(!valid) return false;
    ACTIVE_SENTENCES = data.map(item => ({ category: item.category, jp: item.jp, ko: item.ko || "" }));
    refreshReadingMap();
    return true;
  }).catch(() => {
    if(timer) clearTimeout(timer);
    return false;
  });
}

/* =========================================================================
   구글시트(한자읽기 탭)에서 한자→히라가나 보정 사전 실시간 불러오기
   실패하거나 구글시트 연동이 설정되어 있지 않으면 위 READING_OVERRIDES_DEFAULT를 그대로 사용한다.
   ========================================================================= */
function loadReadingOverridesFromSheet(){
  if(!CONFIG.APPS_SCRIPT_URL) return Promise.resolve(false);
  const controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), 6000) : null;
  return fetch(CONFIG.APPS_SCRIPT_URL + "?action=readings", {
    method: "GET",
    signal: controller ? controller.signal : undefined
  }).then(res => {
    if(timer) clearTimeout(timer);
    if(!res.ok) return false;
    return res.json();
  }).then(data => {
    if(!Array.isArray(data) || data.length === 0) return false;
    const valid = data.every(item => item && typeof item.kanji === "string" && typeof item.reading === "string");
    if(!valid) return false;
    const map = {};
    data.forEach(item => { if(item.kanji) map[item.kanji] = item.reading; });
    ACTIVE_READING_OVERRIDES = map;
    refreshReadingMap();
    return true;
  }).catch(() => {
    if(timer) clearTimeout(timer);
    return false;
  });
}

/* =========================================================================
   기록 탭 렌더링
   ========================================================================= */
function renderHistory(){
  if(!student) return;
  const hist = getLocalHistory();
  const count = hist.length;
  const avg = count ? Math.round(hist.reduce((a,r)=>a+r.score,0)/count) : 0;
  const best = count ? Math.max(...hist.map(r=>r.score)) : 0;

  $("#statCount").textContent = count;
  $("#statAvg").textContent = avg + "%";
  $("#statBest").textContent = best + "%";

  drawTrend(hist);

  if(count === 0){
    $("#historyTableWrap").innerHTML = `<div class="empty">아직 연습 기록이 없어요. '연습하기' 탭에서 첫 문장을 말해보세요!</div>`;
    return;
  }

  const rows = hist.slice().reverse().slice(0, 50).map(r => {
    const d = new Date(r.ts);
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    const color = r.pass ? "var(--good)" : "var(--bad)";
    return `<tr>
      <td>${dateStr}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.sentence}</td>
      <td class="score-cell" style="color:${color}">${r.score}%</td>
    </tr>`;
  }).join("");

  $("#historyTableWrap").innerHTML = `
    <table>
      <thead><tr><th>날짜</th><th>문장</th><th>점수</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function drawTrend(hist){
  const canvas = document.getElementById("trendCanvas");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 300;
  const cssH = 140;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  if(hist.length === 0) return;

  const data = hist.slice(-20).map(r=>r.score);
  const padL = 30, padR = 10, padT = 14, padB = 20;
  const w = cssW - padL - padR, h = cssH - padT - padB;

  ctx.strokeStyle = "#ece4dd";
  ctx.lineWidth = 1;
  [0,25,50,75,100].forEach(v => {
    const y = padT + h - (v/100)*h;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cssW-padR,y); ctx.stroke();
    ctx.fillStyle = "#a89e95"; ctx.font = "10px sans-serif";
    ctx.fillText(v+"%", 2, y+3);
  });

  // 통과선
  const passY = padT + h - (CONFIG.PASS_THRESHOLD/100)*h;
  ctx.strokeStyle = "#e0a12a";
  ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(padL,passY); ctx.lineTo(cssW-padR,passY); ctx.stroke();
  ctx.setLineDash([]);

  // 점수 라인
  ctx.strokeStyle = "#dc4c3f";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  data.forEach((v,i) => {
    const x = data.length === 1 ? padL : padL + (i/(data.length-1))*w;
    const y = padT + h - (v/100)*h;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  ctx.fillStyle = "#dc4c3f";
  data.forEach((v,i) => {
    const x = data.length === 1 ? padL : padL + (i/(data.length-1))*w;
    const y = padT + h - (v/100)*h;
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
  });
}

/* =========================================================================
   초기화
   ========================================================================= */
async function init(){
  initSpeechWarning();
  // 성공하면 구글시트 최신 내용, 실패해도 각각 questions.js / READING_OVERRIDES_DEFAULT로 계속 진행
  await Promise.all([loadSentencesFromSheet(), loadReadingOverridesFromSheet()]);
  populateCategories();
  student = loadStudent();
  if(student){ showMain(); } else { showLogin(); }
  flushPending();
  window.addEventListener("resize", () => { if(student) drawTrend(getLocalHistory()); });
}
init();

})();
