<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>다루마!! 일본어 말하기 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  /* 로그인되어 있지 않으면 화면이 잠깐이라도 보이기 전에 바로 로그인 화면으로 이동 */
  try{
    if(!localStorage.getItem("jpk_student_v1")){ location.replace("index.html"); }
  }catch(e){}
</script>
</head>
<body>

<div class="finish-page">
  <canvas id="fireworksCanvas"></canvas>
  <div class="celeb-content">
    <img class="celeb-daruma animate" id="celebDarumaImg" src="다루마.png" alt="다루마">
    <div class="celeb-text animate">축패스!! 잘했어요</div>
    <button class="btn btn-primary celeb-close" id="btnBackToPractice">연습 화면으로 돌아가기</button>
  </div>
</div>

<script>
(function(){
"use strict";

const $ = (sel) => document.querySelector(sel);

/* ===== 폭죽 애니메이션 ===== */
let fwRAF = null;
function startFireworks(){
  const canvas = $("#fireworksCanvas");
  const ctx = canvas.getContext("2d");
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener("resize", resize);

  let particles = [];
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff7fa8","#ffffff"];
  function spawnBurst(x, y){
    const count = 42;
    for(let i=0;i<count;i++){
      const angle = (Math.PI*2*i)/count + Math.random()*0.2;
      const speed = 2 + Math.random()*3.5;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 1,
        color: colors[(Math.random()*colors.length)|0],
        size: 2 + Math.random()*2
      });
    }
  }

  let lastSpawn = 0;
  function frame(ts){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(!lastSpawn || ts - lastSpawn > 550){
      lastSpawn = ts;
      spawnBurst(canvas.width*(0.2+Math.random()*0.6), canvas.height*(0.2+Math.random()*0.35));
    }
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.life -= 0.012; });
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    fwRAF = requestAnimationFrame(frame);
  }
  fwRAF = requestAnimationFrame(frame);
}

startFireworks();

$("#btnBackToPractice").addEventListener("click", () => {
  location.href = "problem.html";
});

})();
</script>
</body>
</html>
